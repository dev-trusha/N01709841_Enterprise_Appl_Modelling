# Appointment Microservice
server.port=8083
spring.application.name=appointment-service

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console - http://localhost:8083/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Service URLs resolved via Eureka (not hardcoded ports)
patient.service.url=http://PATIENT-SERVICE/api/patients
doctor.service.url=http://DOCTOR-SERVICE/api/doctors

# Jackson - serialize LocalDate as yyyy-MM-dd string
spring.jackson.serialization.write-dates-as-timestamps=false

# Eureka Client - registers this service as APPOINTMENT-SERVICE
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
